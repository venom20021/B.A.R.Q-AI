appId: com.barq.desktop
productName: BARQ
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - resources/icon.png
  - "!node_modules/**/*"

extraResources:
  # PyInstaller onedir layout: python/dist/barq-sidecar/barq-sidecar.exe + _internal/.
  # Copy that folder INTO resources/python/ so python-bridge.ts finds
  # barq-sidecar.exe directly at resources/python/barq-sidecar.exe.
  - from: python/dist/barq-sidecar
    to: python/
    filter:
      - "**/*"

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: venom20021
  repo: B.A.R.Q-AI
  releaseType: release
